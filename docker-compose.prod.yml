# Production overrides for self-hosting at home behind Cloudflare Tunnel.
# Usage:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences vs the dev file:
#   - no published host ports: the database and backend are reachable only over
#     the internal Docker network (so the home router opens NO inbound ports and
#     the home IP is never exposed);
#   - a cloudflared tunnel connects outbound to Cloudflare and serves the app.
#
# NOTE on the 5432 clash: only the dev file (docker-compose.yml) publishes 5432,
# which would collide with a local Postgres. This prod overlay publishes nothing,
# so there is no clash on the home machine. Full guide: docs/05-deployment.md.

services:
  db:
    restart: always
    ports: []

  backend:
    restart: always
    ports: []

  # Nginx is the only service the tunnel targets; it serves the PWA and proxies
  # /api to the backend over the internal network.
  frontend:
    restart: always
    ports: []

  # Outbound-only tunnel. The public hostname → http://frontend:80 mapping is
  # configured in the Cloudflare Zero Trust dashboard; the token carries it.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fc-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - frontend
