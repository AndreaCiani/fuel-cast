name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Integration tests spin up a PostGIS container via Testcontainers.
      # The ubuntu-latest runner already has a working Docker daemon.
      - name: Build & test
        working-directory: backend
        run: mvn -B verify
